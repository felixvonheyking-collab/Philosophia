<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Philosophia</title>

  <!-- Für "Zum Startbildschirm hinzufügen" -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="theme-color" content="#1B1F2A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Philosophia" />
  <meta name="description" content="Persönlicher Karteikasten der Philosophie: Denker:innen, Begriffe, Zitate, Rhetorik-Training und Wiederholen nach dem Karteikasten-Prinzip." />

  <!-- Schriften liegen im Repo, damit die App auch offline richtig aussieht -->
  <link rel="preload" href="font-cormorant-600.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="font-sourcesans-400.woff2" as="font" type="font/woff2" crossorigin />

  <style>
    html, body { margin: 0; padding: 0; background: #1B1F2A; min-height: 100vh; }
    #root { min-height: 100vh; }
    #ladehinweis {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #C9A25D; font-family: Georgia, serif; font-size: 18px; letter-spacing: 0.05em; text-align: center; padding: 20px; box-sizing: border-box;
    }
    #fehlerhinweis { color: #8B3A3A; font-size: 13px; margin-top: 14px; font-family: sans-serif; white-space: pre-wrap; text-align: left; max-width: 100%; overflow-x: auto; }
    #neue-version {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 9999;
      display: none; align-items: center; gap: 12px; max-width: calc(100vw - 32px);
      background: #232838; color: #E8E3D8; border: 1px solid #C9A25D55; border-radius: 10px;
      padding: 10px 14px; font-family: Georgia, serif; font-size: 14px; box-shadow: 0 6px 24px #0008;
    }
    #neue-version button {
      background: #C9A25D; color: #1B1F2A; border: 0; border-radius: 6px; padding: 6px 12px;
      font: inherit; font-size: 13px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="root"><div id="ladehinweis">Philosophia lädt …</div></div>

  <div id="neue-version" role="status">
    <span>Neue Version verfügbar.</span>
    <button type="button" id="neue-version-laden">Neu laden</button>
  </div>

  <!-- Alle Bibliotheken liegen lokal im Repo (vendor.js): kein fremder CDN, offline lauffähig -->
  <script type="importmap">
  {
    "imports": {
      "react": "./vendor.js",
      "react-dom/client": "./vendor.js",
      "lucide-react": "./vendor.js"
    }
  }
  </script>

  <script type="module">
    window.addEventListener('error', (e) => {
      const el = document.getElementById('ladehinweis');
      if (el) {
        el.innerHTML = 'Philosophia konnte nicht geladen werden.<div id="fehlerhinweis">' + (e.message || e) + '</div>';
      }
    });

    import React from 'react';
    import { createRoot } from 'react-dom/client';
    import PhilosophieApp from './philosophie-app.js';
    import Fehlerauffang from './fehlerauffang.js';

    // Der Fehlerauffang verhindert die weiße Seite: Stürzt eine Komponente ab,
    // erscheint eine Erklärung samt Knopf, um die gespeicherten Daten zu retten.
    createRoot(document.getElementById('root')).render(
      React.createElement(Fehlerauffang, null, React.createElement(PhilosophieApp))
    );
  </script>

  <script>
    // Service Worker: macht Philosophia offline lauffähig und meldet neue Versionen.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          const hinweis = document.getElementById('neue-version');
          const knopf = document.getElementById('neue-version-laden');

          const beobachte = (worker) => {
            if (!worker) return;
            worker.addEventListener('statechange', () => {
              // Nur melden, wenn schon eine alte Version lief – sonst ist es die Erstinstallation.
              if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                hinweis.style.display = 'flex';
                knopf.onclick = () => {
                  worker.postMessage({ typ: 'UEBERNIMM' });
                  knopf.disabled = true;
                  knopf.textContent = 'Lädt …';
                };
              }
            });
          };

          beobachte(reg.installing);
          reg.addEventListener('updatefound', () => beobachte(reg.installing));
        }).catch(() => { /* ohne Service Worker läuft die App weiterhin, nur nicht offline */ });

        let neugeladen = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (neugeladen) return;
          neugeladen = true;
          window.location.reload();
        });
      });
    }
  </script>
</body>
</html>
